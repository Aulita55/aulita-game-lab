<style id="app-style">
/* Aulita notebook: quiet squared paper, orange and green accents. */
:root{
  --paper:#fcfbf7;--grid:#eaece7;--ink:#293c35;--text:#33433c;--pen:#c45220;--muted:#64736a;
  --tile:#ffffff;--edge:#ced8cd;--good:#357148;--good-bg:#e8f2e5;--bad-bg:#fbe6e0;--sun:#f7bd79;--mint:#dbeacb;--pink:#f9e4c7;--on-pop:#3b3124;--field:#ffffff;
  --display:"Nunito","Segoe UI",system-ui,sans-serif;--body:"Nunito","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#14302a;--grid:#1d3f37;--ink:#f3f6e8;--text:#e9efe2;--pen:#ff9c8c;--muted:#a8c1b3;
  --tile:#1c3f36;--edge:#cfe0d2;--good:#8fe6ae;--good-bg:#1f5140;--bad-bg:#5a2f2f;--sun:#ffd866;--mint:#9be8c6;--pink:#ffbccb;--on-pop:#20200f;--field:#102822;color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#14302a;--grid:#1d3f37;--ink:#f3f6e8;--text:#e9efe2;--pen:#ff9c8c;--muted:#a8c1b3;
  --tile:#1c3f36;--edge:#cfe0d2;--good:#8fe6ae;--good-bg:#1f5140;--bad-bg:#5a2f2f;--sun:#ffd866;--mint:#9be8c6;--pink:#ffbccb;--on-pop:#20200f;--field:#102822;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;color:var(--text);font:500 17px/1.5 var(--body)}
.wrap{max-width:680px;margin:0 auto;padding-block:16px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);font-weight:400;color:var(--ink);margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:clamp(34px,9vw,46px)}h2{font-size:30px}h3{font-size:24px}
p{margin:0}.muted{color:var(--muted)}.small{font-size:15px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button,.btn{font:800 16px/1.2 var(--body);color:var(--ink);background:var(--tile);border:2px solid var(--edge);border-radius:12px;padding:11px 15px;box-shadow:0 3px 0 var(--edge);cursor:pointer;text-decoration:none;display:inline-block;touch-action:manipulation}
button:active{transform:translateY(3px);box-shadow:none}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
button.main{background:var(--sun);color:var(--on-pop)}
button.ghost{border-color:transparent;box-shadow:none;background:transparent;padding:8px 4px;text-decoration:underline;text-underline-offset:3px}
button.ghost:active{transform:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.topic{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;padding:14px 16px}
.topic b{font:400 25px/1.15 var(--display)}
.topic>span:first-child{min-width:0;overflow-wrap:anywhere}
.stars{color:var(--pen);font-size:18px;letter-spacing:1px;white-space:nowrap;font-weight:800}
.games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.game{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:14px;min-height:132px}
.mark{font:400 22px/1 var(--display);background:var(--sun);color:var(--on-pop);padding:6px 9px;border-radius:7px;transform:rotate(-2deg)}
.game:nth-child(3n+2) .mark{background:var(--mint)}.game:nth-child(3n) .mark{background:var(--pink)}
.game strong{font:400 24px/1.1 var(--display)}
.game small{font:500 14px/1.3 var(--body);color:var(--muted)}
.bar{height:10px;border:2px solid var(--edge);border-radius:6px;overflow:hidden;background:var(--tile)}
.bar i{display:block;height:100%;background:var(--pen);transition:width .25s}
.prompt{background:var(--tile);border:2px solid var(--edge);border-radius:14px;padding:16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.big{font:400 clamp(30px,9vw,42px)/1.15 var(--display);color:var(--ink);overflow-wrap:anywhere}
.flip{width:100%;min-height:230px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;text-align:center}
.say{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;font-size:14px}
.say svg{width:18px;height:18px;fill:currentColor}
.pairs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pairs>div{display:flex;flex-direction:column;gap:10px}
.pair{width:100%;min-height:58px;overflow-wrap:anywhere;padding:9px 7px}
.pair.on{background:var(--sun);color:var(--on-pop)}
.pair.done{background:var(--good-bg);color:var(--good);border-color:var(--good);box-shadow:none;cursor:default}
.shake{animation:shake .32s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.sky{position:relative;height:clamp(330px,56vh,470px);border:2px solid var(--edge);border-radius:14px;overflow:hidden;background:var(--tile)}
.balloon{position:absolute;top:0;width:calc(33.33% - 8px);min-height:96px;border-radius:50% 50% 46% 46%;padding:10px 5px;font:800 14.5px/1.15 var(--body);color:var(--on-pop);overflow-wrap:anywhere;border:2px solid var(--on-pop);box-shadow:none;background:var(--sun)}
.balloon::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:30px;background:var(--edge)}
.balloon:nth-child(2){background:var(--mint)}.balloon:nth-child(3){background:var(--pink)}
.balloon.miss{opacity:.3}.balloon:active{transform:none}
.lives{color:var(--pen);font-weight:800;letter-spacing:2px}
.slots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:50px}
.slot{min-width:34px;min-height:44px;padding:6px 8px;border-bottom:3px solid var(--edge);font:400 26px/1.2 var(--display);color:var(--ink);text-align:center}
.slot.got{color:var(--good);border-color:var(--good)}
.pool{display:flex;flex-wrap:wrap;gap:9px;justify-content:center}
.pool button{min-width:48px;min-height:50px;font-size:20px}
.pool button.lower{text-transform:lowercase}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px}
.opt{overflow-wrap:anywhere;min-width:0}
.opt.ok{background:var(--good-bg);color:var(--good);border-color:var(--good)}
.opt.no{background:var(--bad-bg);opacity:.75}
.gapq{font:400 clamp(26px,7vw,34px)/1.3 var(--display);color:var(--ink)}
.gapq u{color:var(--pen);text-decoration-thickness:2px;text-underline-offset:5px}
.note{font:400 clamp(44px,13vw,64px)/1 var(--display);color:var(--pen);transform:rotate(-3deg);text-align:center;padding-block:8px;text-wrap:balance}
.bigstars{font-size:48px;color:var(--pen);text-align:center;letter-spacing:6px;line-height:1}
.bigstars span{color:var(--grid)}
.box{background:var(--tile);border:2px solid var(--edge);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
label{font-weight:800;font-size:15px;color:var(--ink);display:flex;flex-direction:column;gap:5px}
input,textarea,select{font:500 16px/1.4 var(--body);color:var(--text);background:var(--field);border:2px solid var(--muted);border-radius:9px;padding:9px 10px;width:100%;min-width:0}
textarea{min-height:128px;resize:vertical}
.hint{font-weight:500;color:var(--muted);font-size:14px}
.err{color:var(--pen);font-weight:700;font-size:15px}
.list-row{display:flex;flex-direction:column;gap:8px;padding-block:12px;border-top:2px dashed var(--grid)}
.list-row:first-of-type{border-top:0}
.list-row strong{font:400 23px/1.15 var(--display);color:var(--ink);overflow-wrap:anywhere}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;max-height:430px;overflow-y:auto;padding:4px}
.thumb{padding:4px;position:relative;box-shadow:none;border-color:var(--muted);min-width:0}
.thumb:active{transform:none}
.thumb img{display:block;width:100%;aspect-ratio:3/4;object-fit:contain;background:var(--grid);border-radius:5px}
.thumb span{display:block;text-align:center;font-size:13px;padding-top:3px}
.thumb.on{border-color:var(--pen);border-width:3px;padding:3px;background:var(--sun);color:var(--on-pop)}
.sub{border-top:2px dashed var(--grid);padding-top:14px}
summary{font-weight:800;cursor:pointer;color:var(--ink)}
.pic{display:inline-block;width:72px;height:72px;vertical-align:middle;object-fit:contain;-webkit-user-drag:none;user-select:none}
.pic-text{font-size:58px;line-height:1.1}
.prompt .pic,.big .pic{width:clamp(96px,30vw,132px);height:clamp(96px,30vw,132px)}
.pair .pic{width:44px;height:44px}.mem .pic{width:54px;height:54px}.balloon .pic{width:56px;height:56px}
.clue .pic{width:32px;height:32px}.opt .pic{width:60px;height:60px}.tf-tr .pic{width:96px;height:96px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-weight:700;max-width:calc(100% - 32px);z-index:20;text-align:center}
.memory{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.mem{min-height:88px;padding:6px 4px;overflow-wrap:anywhere;font-size:15px}
.mem:not(.up){font:400 34px/1 var(--display);background:var(--ink);color:var(--paper)}
.mem.up{background:var(--sun);color:var(--on-pop)}
.mem.done{background:var(--good-bg);color:var(--good);border-color:var(--good);box-shadow:none}
.tf-tr{font-size:22px;font-weight:800;color:var(--text);overflow-wrap:anywhere}
.board{display:grid;gap:3px;background:var(--tile);border:2px solid var(--edge);border-radius:12px;padding:6px}
.cell{aspect-ratio:1;min-width:0;padding:0;border:0;box-shadow:none;border-radius:6px;background:transparent;font:800 clamp(15px,4.6vw,21px)/1 var(--body);text-transform:uppercase}
.cell:active{transform:none}
.cell.on{background:var(--sun);color:var(--on-pop)}
.cell.done{background:var(--good-bg);color:var(--good)}
.clue{font-weight:700;font-size:15px;padding:4px 9px;border:2px dashed var(--muted);border-radius:8px;overflow-wrap:anywhere}
.clue.got{border-style:solid;border-color:var(--good);color:var(--good);background:var(--good-bg)}
.track{display:flex;flex-direction:column;gap:6px;padding:8px;border:2px solid var(--edge);border-radius:12px;background:var(--tile);background-image:repeating-linear-gradient(0deg,var(--ink) 0 6px,transparent 6px 12px);background-size:6px 100%;background-repeat:no-repeat;background-position:right 6px top}
.lane{position:relative;height:36px;margin-right:12px;border-bottom:2px dashed var(--muted)}
.car{position:absolute;left:0;top:2px;width:66px;text-align:center;font-weight:800;font-size:14px;line-height:28px;border-radius:14px 18px 8px 8px;background:var(--mint);color:var(--on-pop);transition:left .35s}
.car.you{background:var(--sun)}
@media (prefers-reduced-motion:reduce){.car{transition:none}}
@media (max-width:370px){.games{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}.bar i{transition:none}}
.pic.scene{display:inline-flex;align-items:center;justify-content:center;gap:2px;width:auto!important;height:auto!important;max-width:100%;flex-wrap:wrap}
.pic.scene>.pic,.pic.scene>.pic-text{width:52px!important;height:52px!important;font-size:40px}
.prompt .pic.scene>.pic,.flip .pic.scene>.pic,.tf-tr .pic.scene>.pic{width:clamp(56px,19vw,84px)!important;height:clamp(56px,19vw,84px)!important}
.pair .pic.scene>.pic,.opt .pic.scene>.pic,.mem .pic.scene>.pic,.balloon .pic.scene>.pic,.clue .pic.scene>.pic,.card-pic .pic.scene>.pic{width:30px!important;height:30px!important;font-size:24px}
.pic.scene>.freq{width:auto!important;height:auto!important}
.card-pic .pic.scene>.pic{width:40px!important;height:40px!important}
.verb-card{min-height:280px}.verb-example{font-size:18px;margin:0}.verb-example b{color:var(--pen)}
.book-tabs{display:flex;gap:6px;overflow-x:auto;border-bottom:2px solid var(--edge);scrollbar-width:thin}
.book-tab{flex:0 0 auto;padding:10px 12px;border:2px solid transparent;border-bottom:0;border-radius:14px 14px 0 0;font-weight:800;font-size:15px;color:var(--muted);text-decoration:none;margin-bottom:-2px}
.book-tab[aria-current="page"]{color:var(--ink);background:var(--tile);border-color:var(--edge);border-bottom:2px solid var(--tile)}
.book-tab:focus-visible{outline:3px solid var(--pen);outline-offset:-3px}
.topic-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.topic-card{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:8px;text-align:center;padding:14px 10px;min-width:0}
.topic-card .card-text{display:flex;flex-direction:column;gap:3px;min-width:0}
.topic-card b{font-size:17px;line-height:1.2;overflow-wrap:anywhere}
.topic-card .card-pic .pic{width:88px;height:88px}
.topic-card.wide{grid-column:1/-1;flex-direction:row;justify-content:center;gap:16px;text-align:left}
.letter-card{padding-top:10px}.letter-card .card-pic .pic{width:64px;height:64px}
.card-letter{font-size:42px;font-weight:800;line-height:1;color:var(--pen)}
.with-pic{display:inline-flex;flex-direction:column;align-items:center;gap:4px;max-width:100%}
.with-pic>span{font-size:15px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.big .with-pic>span,.prompt .with-pic>span{font-size:18px}
.freq{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.freq-bars{display:flex;gap:4px;align-items:flex-end;height:44px}
.freq-bars i{display:block;width:11px;border-radius:4px;background:var(--grid);border:1.5px solid var(--edge)}
.freq-bars i:nth-child(1){height:30%}.freq-bars i:nth-child(2){height:47%}.freq-bars i:nth-child(3){height:64%}.freq-bars i:nth-child(4){height:82%}.freq-bars i:nth-child(5){height:100%}
.freq-bars i.on{background:var(--pen);border-color:var(--pen)}
.freq small{font-size:13px;font-weight:800;color:var(--ink)}
.opt.line{width:100%;text-align:left;padding:14px;font-size:18px}
.pic.photo{object-fit:cover;border-radius:10px}
</style>

<script id="app-code">
(function(){
"use strict";
let DATA={books:[],topics:[]};
const API="https://api.github.com/repos/Aulita55/aulita-game-lab/contents/games/english-notebook/topics.json";

let gameCleanup=null;
function stopGameResources(){if(window.NotebookVoice)NotebookVoice.stop();if(gameCleanup){const clean=gameCleanup;gameCleanup=null;clean()}}
let run=0,editing=null,loaded=false,loadFailed=false,token=null,teacherReady=false,fileSha=null,loginError="";

/* ---------- helpers ---------- */
function el(tag,props,...kids){const n=document.createElement(tag);if(props)for(const k in props){if(k==="on"){for(const e in props.on)n.addEventListener(e,props.on[e])}else if(k==="class")n.className=props[k];else if(k in n&&k!=="list")n[k]=props[k];else n.setAttribute(k,props[k])}for(const c of kids.flat()){if(c!==null&&c!==undefined&&c!==false)n.append(c)}return n}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

const PHOTO_FAILED=new Set();let photoSource=null,photoMap={};
function photoBase(alt){if(photoSource!==DATA){photoSource=DATA;photoMap={};DATA.topics.forEach(t=>(t.verbs||[]).forEach(v=>{photoMap[v[3]]=v[0]}))}return photoMap[alt]}
function sceneParts(em){if(em.startsWith("freq:"))return [em];if(/\s/.test(em.trim()))return em.trim().split(/\s+/);try{if(window.Intl&&Intl.Segmenter)return [...new Intl.Segmenter().segment(em)].map(x=>x.segment)}catch(e){}return [em]}

function picEl(em,alt,scope=ACTIVE_TOPIC){
